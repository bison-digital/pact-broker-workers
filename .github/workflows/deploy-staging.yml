name: Deploy to Staging

# REFERENCE IMPLEMENTATION — not this project's own CI (that is ci.yml).
#
# This is the deployment an operator adopts for their own broker. It needs one
# credential, CLOUDFLARE_API_TOKEN, and nothing outside Cloudflare: no
# Terraform, no state backend, no bucket, no second cloud account.
#
# Inert until configured, in two stages:
#   - No WORKER_NAME on the environment -> the job SKIPS, so upstream and
#     personal forks stay green with no opt-in flag to remember.
#   - Partially configured              -> the job FAILS listing the missing
#     variables, rather than deploying something half-formed.
#
# The broker's bearer token is NOT here. Seed it once per Worker:
#   openssl rand -hex 32 | wrangler secret put PACT_BROKER_TOKEN --name <worker>
# Worker secrets survive every deploy, so CI never needs to know it.
#
# Cloudflare Access is NOT applied here either — it is an optional Terraform
# module an operator runs from their own config. See infra/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: vars.WORKER_NAME != ''
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Consumed by scripts/render-wrangler-config.mjs.
      DOMAIN: ${{ vars.DOMAIN }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      ALLOW_PUBLIC_READ: ${{ vars.ALLOW_PUBLIC_READ }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      PUBLIC_BADGES: ${{ vars.PUBLIC_BADGES }}
      MUTATING_RATE_LIMIT_THRESHOLD: ${{ vars.MUTATING_RATE_LIMIT_THRESHOLD }}
      READ_RATE_LIMIT_THRESHOLD: ${{ vars.READ_RATE_LIMIT_THRESHOLD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify environment is configured
        run: |
          missing=""
          [ -n "$DOMAIN" ] || missing="$missing DOMAIN"
          [ -n "$WORKER_NAME" ] || missing="$missing WORKER_NAME"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::The 'staging' GitHub Environment is missing:$missing"
            echo "See docs/CICD.md — this workflow is a reference implementation"
            echo "and does nothing until an operator configures it."
            exit 1
          fi

      # Re-run the checks against the exact commit being deployed. ci.yml ran
      # them on the PR, but main can move underneath a manual dispatch.
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test:run

      - name: Deploy
        # Renders wrangler.jsonc from the env above, then deploys. Fails if
        # PACT_BROKER_TOKEN was never seeded (secrets.required in the
        # template), rather than shipping an unconfigured broker.
        run: pnpm run deploy

      - name: Smoke test
        # Deliberately tokenless — CI holds no bearer token.
        #   1. /health reports storage:"ok" only after the Durable Object
        #      round-trip resolves, proving Worker + DO binding + SQLite.
        #   2. /pacticipants must 401, proving auth middleware is live.
        run: |
          set -euo pipefail

          for i in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 10 "https://${DOMAIN}/health"); then
              echo "$body" | jq -e '.status == "ok" and .storage == "ok"' > /dev/null
              echo "Health check passed: ${body}"
              break
            fi
            if [ "$i" = "5" ]; then
              echo "::error::Health check failed after 5 attempts"
              exit 1
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

          # `|| true` so a connection failure falls through to the diagnostic
          # below rather than being killed by `set -e`.
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            "https://${DOMAIN}/pacticipants" || true)
          if [ "$status" != "401" ]; then
            echo "::error::Expected 401 from unauthenticated GET /pacticipants, got ${status}."
            echo "If this is 200 the broker is serving data without auth — check ALLOW_PUBLIC_READ."
            exit 1
          fi
          echo "Auth check passed: unauthenticated /pacticipants returned 401"
