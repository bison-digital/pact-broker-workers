name: CI

# This project's own quality gate. It holds no credentials, deploys nothing,
# and is not gated behind an opt-in variable — it runs on every PR and every
# push, on this repo and on every fork, without setup.
#
# Deployment is a separate concern: see deploy-staging.yml / deploy-production.yml,
# which are a reference implementation operators adopt for their own broker.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Test, and Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test:run

  config-renders:
    name: Guard — wrangler config renders for an operator
    # The suite renders wrangler.jsonc without a DOMAIN, so the routes block is
    # always empty there. This proves the operator-shaped render also produces
    # valid config, which is otherwise only discovered at deploy time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Render with operator values and dry-run the deploy
        env:
          DOMAIN: pact-broker.example.com
          WORKER_NAME: pact-broker-ci-check
          CLOUDFLARE_ACCOUNT_ID: "0000000000000000000000000000cafe"
          MUTATING_RATE_LIMIT: "30"
          READ_RATE_LIMIT: "300"
        run: |
          pnpm run render-config
          # --dry-run needs no credentials and does not contact the API. It
          # catches a malformed template, a bad binding, or a bundle that
          # cannot build — all of which would otherwise fail mid-deploy.
          pnpm exec wrangler deploy --dry-run --outdir /tmp/ci-dryrun

      - name: Assert the custom domain made it into the config
        run: |
          grep -q '"custom_domain": *true' wrangler.jsonc \
            || { echo "::error::routes block did not render a custom domain"; exit 1; }
          grep -q 'pact-broker.example.com' wrangler.jsonc \
            || { echo "::error::DOMAIN did not reach wrangler.jsonc"; exit 1; }
          echo "OK — operator render is valid."
