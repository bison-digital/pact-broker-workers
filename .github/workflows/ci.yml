name: CI

# This project's own quality gate. It holds no credentials, deploys nothing,
# and is not gated behind an opt-in variable — it runs on every PR and every
# push, on this repo and on every fork, with no configuration.
#
# Deployment is a separate concern: deploy-staging.yml / deploy-production.yml
# are a reference implementation operators adopt for their own broker.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Test, and Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test:run

  config-renders:
    name: Guard — config renders for an operator
    # The test suite always renders wrangler.jsonc with no DOMAIN, so the
    # routes block is empty there and the operator-shaped path is never
    # exercised. This is the only thing that checks it, and it needs no
    # credentials: `--dry-run` builds the bundle and resolves bindings
    # without contacting the API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Render with operator values and dry-run the deploy
        env:
          DOMAIN: pact-broker.example.com
          WORKER_NAME: pact-broker-ci-check
          CLOUDFLARE_ACCOUNT_ID: "0000000000000000000000000000cafe"
          MUTATING_RATE_LIMIT_THRESHOLD: "30"
          READ_RATE_LIMIT_THRESHOLD: "300"
        run: |
          pnpm run render-config
          pnpm exec wrangler deploy --dry-run --outdir /tmp/ci-dryrun

      - name: Assert the custom domain reached the config
        run: |
          grep -q '"custom_domain": *true' wrangler.jsonc \
            || { echo "::error::routes block did not render a custom domain"; exit 1; }
          grep -q 'pact-broker.example.com' wrangler.jsonc \
            || { echo "::error::DOMAIN did not reach wrangler.jsonc"; exit 1; }
          echo "OK — operator render is valid."

  infra-validate:
    name: Terraform fmt + validate (Access module)
    # infra/ is an optional Terraform module that CI never applies, so this is
    # the only thing keeping it honest. Needs no credentials — a module with no
    # provider block validates standalone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.8"
      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: infra
      - name: Terraform validate
        run: terraform validate -no-color
        working-directory: infra
