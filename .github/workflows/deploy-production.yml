name: Deploy to Production

# REFERENCE IMPLEMENTATION — not this project's own CI (that is ci.yml).
# See deploy-staging.yml for the full note on the model.
#
# The approval gate here is the `production` GitHub Environment's
# required-reviewer rule, NOT a Terraform plan. Configure it under
# Settings -> Environments -> production -> Required reviewers. Without that
# rule this deploys unattended, which defeats the point.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs unattended, before the gate, so a reviewer approves a change that has
  # already been proven to build. --dry-run needs no credentials and contacts
  # nothing; it produces the binding list a reviewer should sanity-check.
  preflight:
    name: Checks and deploy preview
    runs-on: ubuntu-latest
    environment: staging # env-scoped vars only; no approval rule on staging
    env:
      DOMAIN: ${{ vars.DOMAIN }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test:run

      - name: Build preview
        run: |
          pnpm run render-config
          pnpm exec wrangler deploy --dry-run --outdir /tmp/preview 2>&1 | tee preview.txt

      - name: Render preview to workflow summary
        run: |
          {
            echo '## Deploy preview'
            echo ''
            echo 'Bindings and bundle for the commit awaiting approval:'
            echo ''
            echo '```'
            head -c 900000 preview.txt
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Production
    needs: preflight
    runs-on: ubuntu-latest
    environment: production # required-reviewer gate — approver reads the preview above
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: ${{ vars.DOMAIN }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      ALLOW_PUBLIC_READ: ${{ vars.ALLOW_PUBLIC_READ }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      PUBLIC_BADGES: ${{ vars.PUBLIC_BADGES }}
      MUTATING_RATE_LIMIT: ${{ vars.MUTATING_RATE_LIMIT }}
      READ_RATE_LIMIT: ${{ vars.READ_RATE_LIMIT }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify environment is configured
        run: |
          missing=""
          [ -n "$DOMAIN" ] || missing="$missing DOMAIN"
          [ -n "$WORKER_NAME" ] || missing="$missing WORKER_NAME"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::The 'production' GitHub Environment is missing:$missing"
            exit 1
          fi

      - name: Deploy
        run: pnpm run deploy

      - name: Smoke test
        # Tokenless — see deploy-staging.yml for why.
        run: |
          set -euo pipefail

          for i in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 10 "https://${DOMAIN}/health"); then
              echo "$body" | jq -e '.status == "ok" and .storage == "ok"' > /dev/null
              echo "Health check passed: ${body}"
              break
            fi
            if [ "$i" = "5" ]; then
              echo "::error::Health check failed after 5 attempts"
              exit 1
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            "https://${DOMAIN}/pacticipants" || true)
          if [ "$status" != "401" ]; then
            echo "::error::Expected 401 from unauthenticated GET /pacticipants, got ${status}."
            exit 1
          fi
          echo "Auth check passed: unauthenticated /pacticipants returned 401"
