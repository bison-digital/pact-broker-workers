name: Deploy to Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, Test, and Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test:run

  plan:
    name: Terraform Plan (production)
    needs: checks
    if: vars.INFRA_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Bind to `production` so env-scoped vars/secrets resolve. The plan
    # itself doesn't need the reviewer gate (it's read-only); the gate
    # is on the `apply` job below.
    environment: production
    env:
      # R2 credentials for the Terraform state backend. The S3 protocol
      # reads them from these conventional names — a naming convention,
      # NOT an AWS dependency.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_worker_name: ${{ vars.WORKER_NAME }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.8"

      - name: Write backend config
        # Mirrors infra/backend.hcl.example. Written here rather than passed
        # as -backend-config flags because `endpoints` is a nested block.
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > backend.hcl <<HCL
          bucket = "${STATE_BUCKET}"
          key    = "pact-broker-workers/terraform.tfstate"
          region = "auto"
          endpoints = { s3 = "https://${ACCOUNT_ID}.r2.cloudflarestorage.com" }
          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_s3_checksum            = true
          use_path_style              = true
          use_lockfile                = true
          HCL
        working-directory: infra

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl
        working-directory: infra

      - name: Select workspace
        run: terraform workspace select -or-create "${{ vars.TF_WORKSPACE }}"
        working-directory: infra

      - name: Terraform plan
        run: terraform plan -no-color -input=false -out=tfplan | tee plan.txt
        working-directory: infra

      - name: Render plan to workflow summary
        run: |
          {
            echo '## Terraform plan (production)'
            echo ''
            echo '```'
            head -c 900000 infra/plan.txt
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tfplan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-production
          path: infra/tfplan
          retention-days: 7
          if-no-files-found: error

  apply:
    name: Terraform Apply (production)
    needs: plan
    if: vars.INFRA_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production   # required-reviewer gate — approver reads the plan summary above
    env:
      # R2 credentials for the Terraform state backend. The S3 protocol
      # reads them from these conventional names — a naming convention,
      # NOT an AWS dependency.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_worker_name: ${{ vars.WORKER_NAME }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.8"

      - name: Write backend config
        # Mirrors infra/backend.hcl.example. Written here rather than passed
        # as -backend-config flags because `endpoints` is a nested block.
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > backend.hcl <<HCL
          bucket = "${STATE_BUCKET}"
          key    = "pact-broker-workers/terraform.tfstate"
          region = "auto"
          endpoints = { s3 = "https://${ACCOUNT_ID}.r2.cloudflarestorage.com" }
          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_s3_checksum            = true
          use_path_style              = true
          use_lockfile                = true
          HCL
        working-directory: infra

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl
        working-directory: infra

      - name: Select workspace
        run: terraform workspace select -or-create "${{ vars.TF_WORKSPACE }}"
        working-directory: infra

      - name: Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-production
          path: infra

      - name: Terraform apply
        run: terraform apply -input=false tfplan
        working-directory: infra

      - name: Smoke test
        # Deliberately tokenless — CI holds no bearer token. /health returns
        # storage:"ok" only after the DO round-trip succeeded, and
        # /pacticipants must 401. See deploy-staging.yml for the full note.
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          set -euo pipefail

          for i in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 10 "https://${DOMAIN}/health"); then
              echo "$body" | jq -e '.status == "ok" and .storage == "ok"' > /dev/null
              echo "Health check passed: ${body}"
              break
            fi
            if [ "$i" = "5" ]; then
              echo "Health check failed after 5 attempts"
              exit 1
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

          # `|| true` so a connection failure falls through to the
          # diagnostic below rather than being killed by `set -e`.
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            "https://${DOMAIN}/pacticipants" || true)
          if [ "$status" != "401" ]; then
            echo "Expected 401 from unauthenticated GET /pacticipants, got HTTP ${status}."
            echo "If this is 200 the broker is serving data without auth — check ALLOW_PUBLIC_READ."
            exit 1
          fi
          echo "Auth check passed: unauthenticated /pacticipants returned 401"
