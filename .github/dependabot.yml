version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Majors used to arrive one lonely PR each and none got merged —
      # wrangler 3->4, vitest 2->4, zod 3->4 and typescript 5->7 all sat open
      # until they had to be done together as one large change. They are
      # genuinely coupled (vitest-pool-workers hard-peers a vitest major), so
      # grouping them makes one reviewable PR instead of several unmergeable
      # ones.
      major:
        applies-to: version-updates
        update-types:
          - major
      security:
        applies-to: security-updates
        update-types:
          - minor
          - patch
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"
